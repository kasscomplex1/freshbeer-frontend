<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRESH SERVE CERTIFIED</title>
<style>
body{{margin:0;font-family:system-ui;background:#0a0a0a;color:#d4e8d4;display:flex;align-items:center;justify-content:center;min-height:100vh}}
.b{{border:3px solid #00ff41;padding:30px 50px;border-radius:12px;text-align:center;background:#111;box-shadow:0 0 30px rgba(0,255,65,.3)}}
h1{{color:#00ff41;font-size:1.6em;margin:0 0 10px;letter-spacing:2px}}
.s{{font-size:4em;font-family:monospace;color:#00ff41;font-weight:700;margin:10px 0;text-shadow:0 0 20px rgba(0,255,65,.5)}}
.band{{display:inline-block;padding:8px 20px;border:1px solid #00ff41;border-radius:4px;color:#00ff41;font-weight:700;letter-spacing:2px;margin-top:10px}}
.m{{color:#6a8a6a;font-size:.85em;margin-top:14px}}
</style></head><body>
<div class="b">
  <h1>🍺 FRESH SERVE CERTIFIED</h1>
  <div style="color:#d4e8d4;font-size:1.1em">{name}</div>
  <div class="m">{area}</div>
  <div class="s">{score}</div>
  <div class="band">{band}</div>
  <div class="m">{scans} scans · {fresh_pct}% fresh · avg {avg_age} days</div>
</div></body></html>
