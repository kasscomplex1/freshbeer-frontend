<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRESH SERVE CERTIFIED · {name}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #0d1410;
  --border: #1a2e1f;
  --accent: #39ff7a;
  --accent-glow: rgba(57, 255, 122, 0.35);
  --text: #eaffea;
  --dim: #88a888;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100vh; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  font-size: 15px;
  line-height: 1.5;
}
.badge {
  background: var(--surface);
  border: 2px solid var(--accent);
  padding: 44px 52px;
  text-align: center;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 0 60px var(--accent-glow), inset 0 0 60px rgba(57, 255, 122, 0.04);
  position: relative;
}
.badge::before, .badge::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2px solid var(--accent);
}
.badge::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
.badge::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

.brand-bar {
  display: flex;
  justify-content: space-between;
  font-size: 0.65em;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  margin-bottom: 20px;
}
.brand-bar strong { color: var(--accent); font-weight: 700; }

.eyebrow {
  font-size: 0.7em;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 8px;
  font-weight: 500;
}
.head {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 1.65rem;
  letter-spacing: -0.02em;
  color: var(--accent);
  margin-bottom: 4px;
  line-height: 1.1;
}
.subhead {
  font-size: 0.7em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 32px;
  font-weight: 500;
}
.outlet-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--text);
  margin-bottom: 4px;
}
.outlet-area {
  font-size: 0.78em;
  color: var(--dim);
  letter-spacing: 0.06em;
  margin-bottom: 32px;
}
.score {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 5.2rem;
  color: var(--accent);
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 4px;
  text-shadow: 0 0 32px var(--accent-glow);
}
.score-of {
  font-size: 0.65em;
  letter-spacing: 0.32em;
  color: var(--dim);
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 24px;
}
.band {
  display: inline-block;
  padding: 10px 22px;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-weight: 700;
  font-size: 0.78em;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}
.meta {
  margin-top: 28px;
  font-size: 0.74em;
  color: var(--dim);
  letter-spacing: 0.06em;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="badge">
  <div class="brand-bar">
    <strong>Fresh</strong> · Lab
    <span>TZ · 2026</span>
  </div>
  <div class="eyebrow">Born On · Verified</div>
  <div class="head">Fresh Serve</div>
  <div class="subhead">Certified</div>
  <div class="outlet-name">{name}</div>
  <div class="outlet-area">{area}</div>
  <div class="score">{score}</div>
  <div class="score-of">out of 100</div>
  <div class="band">{band}</div>
  <div class="meta">{scans} scans · {fresh_pct}% fresh · avg {avg_age} days</div>
</div>
</body>
</html>
