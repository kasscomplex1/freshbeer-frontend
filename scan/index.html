<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BORN ON · Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4efe6;
  --surface: #faf6ed;
  --surface-2: #ece4d2;
  --border: #d4c9b0;
  --border-bright: #b8ad94;
  --accent: #1f5f5b;
  --accent-2: #3a8a85;
  --accent-glow: rgba(31, 95, 91, 0.16);
  --text: #2c3530;
  --dim: #7a7568;
  --warn: #c47a3a;
  --bad: #a04545;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--accent); color: var(--bg); }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  line-height: 1.55;
  font-size: 15px;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  padding: 32px 16px 80px;
}
.shell { max-width: 440px; width: 100%; margin: 0 auto; }
.brand-bar {
  display: flex;
  justify-content: space-between;
  font-size: 0.7em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px;
  margin-bottom: 36px;
}
.brand-bar strong { color: var(--accent); font-weight: 700; letter-spacing: 0.32em; }

.hero-born {
  text-align: center;
  margin-bottom: 36px;
}
.hero-born .k {
  font-size: 0.7em;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  margin-bottom: 12px;
}
.hero-born .v {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: clamp(2.6rem, 12vw, 4rem);
  letter-spacing: -0.04em;
  color: var(--accent);
  text-shadow: 0 0 24px var(--accent-glow);
  line-height: 1;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 22px 22px;
  margin-bottom: 12px;
}
.panel h2 {
  font-size: 0.7em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  margin: 18px 0 10px;
}
.panel h2:first-child { margin-top: 0; }
.outlet-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1em;
  color: var(--text);
  font-weight: 500;
}

select {
  width: 100%;
  padding: 14px 14px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.92em;
  font-weight: 500;
  margin-top: 4px;
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--accent) 50%),
    linear-gradient(135deg, var(--accent) 50%, transparent 50%);
  background-position:
    calc(100% - 18px) 50%,
    calc(100% - 12px) 50%;
  background-size: 6px 6px;
  background-repeat: no-repeat;
  padding-right: 36px;
}
select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-primary {
  width: 100%;
  margin-top: 16px;
  padding: 18px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 0.85em;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: var(--accent);
  color: var(--bg);
  border: none;
  cursor: pointer;
  transition: all 120ms cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-primary:hover { background: var(--text); }
.btn-primary:active { transform: translateY(1px); }
.btn-primary:disabled { background: var(--dim); cursor: not-allowed; }

.result-band {
  padding: 22px 16px;
  text-align: center;
  font-weight: 700;
  font-size: 1.4rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 12px;
  border: 2px solid;
}
.result-band.fresh { background: rgba(31,95,91,0.06); border-color: var(--accent); color: var(--accent); }
.result-band.good { background: rgba(196,122,58,0.06); border-color: var(--warn); color: var(--warn); }
.result-band.bad { background: rgba(160,69,69,0.06); border-color: var(--bad); color: var(--bad); }
.result-band small {
  display: block;
  font-size: 0.55em;
  letter-spacing: 0.18em;
  margin-top: 8px;
  font-weight: 500;
  opacity: 0.7;
}

.score-block {
  margin-top: 12px;
  padding: 24px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  text-align: center;
}
.score-block .n {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 4rem;
  color: var(--accent);
  letter-spacing: -0.04em;
  line-height: 1;
  text-shadow: 0 0 24px var(--accent-glow);
}
.score-block .l {
  font-size: 0.7em;
  color: var(--dim);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-top: 12px;
  font-weight: 500;
}
.score-block .meta {
  margin-top: 14px;
  font-size: 0.82em;
  color: var(--dim);
}

.error {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid var(--bad);
  background: rgba(255,85,68,0.06);
  color: var(--bad);
  font-size: 0.85em;
}

footer.brand-line {
  margin-top: 36px;
  text-align: center;
  font-size: 0.7em;
  letter-spacing: 0.22em;
  color: var(--dim);
  text-transform: uppercase;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="shell">

<div class="brand-bar">
  <span><strong>Fresh</strong> · Lab</span>
  <span>TZ · 2026</span>
</div>

<div class="hero-born">
  <div class="k">Born on</div>
  <div class="v" id="born">—</div>
</div>

<div class="panel">
  <h2>Outlet</h2>
  <div class="outlet-line" id="outletMeta">—</div>

  <h2>Bottle age</h2>
  <select id="age">
    <option value="0">0–2 days · just delivered</option>
    <option value="5">3–7 days · fresh</option>
    <option value="14">8–21 days · getting old</option>
    <option value="30">22+ days · too old</option>
  </select>

  <button class="btn-primary" onclick="submitScan()">Report freshness</button>
  <div id="error" style="display:none" class="error"></div>
  <div id="result" style="display:none" class="result-band"></div>
</div>

<div id="scorePanel" style="display:none">
  <div class="score-block">
    <div class="n" id="scoreNum">—</div>
    <div class="l" id="scoreBand">—</div>
    <div class="meta" id="scoreMeta">—</div>
  </div>
</div>

<footer class="brand-line">Fresh Beer Lab · Tanzania · 2026</footer>

<script>
const API = 'https://api.fauluhost.co.tz';
const params = new URLSearchParams(location.search);
const batchId = params.get('batch') || '';
const outletId = params.get('outlet') || '';
document.getElementById('born').textContent = batchId || '—';
document.getElementById('outletMeta').textContent = outletId || '—';

async function submitScan(){
  const errEl = document.getElementById('error');
  const resultEl = document.getElementById('result');
  const scorePanel = document.getElementById('scorePanel');
  const btn = document.querySelector('.btn-primary');
  errEl.style.display = 'none';
  resultEl.style.display = 'none';
  scorePanel.style.display = 'none';
  if (!batchId || !outletId){
    errEl.textContent = 'Missing batch or outlet in QR. Contact your retailer.';
    errEl.style.display = 'block';
    return;
  }
  const age = parseInt(document.getElementById('age').value);
  btn.disabled = true;
  btn.textContent = 'Reporting...';
  try {
    const r = await fetch(API + '/scan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        batch_id: batchId,
        outlet_id: outletId,
        born_on: new Date(Date.now() - age * 86400000).toISOString().slice(0, 10)
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    resultEl.style.display = 'block';
    const cls = d.band === 'FRESH' ? 'fresh' : d.band === 'GOOD' ? 'good' : 'bad';
    resultEl.className = 'result-band ' + cls;
    resultEl.innerHTML = d.band + '<small>' + d.age_days + ' days old</small>';
    scorePanel.style.display = 'block';
    document.getElementById('scoreNum').textContent = d.outlet_score.score;
    document.getElementById('scoreBand').textContent = d.outlet_score.band;
    document.getElementById('scoreMeta').textContent =
      d.outlet_score.scans + ' scans · ' +
      d.outlet_score.fresh_pct + '% fresh · avg age ' +
      d.outlet_score.avg_age_days + ' days';
  } catch (e){
    errEl.textContent = 'Could not reach server: ' + e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Report freshness';
  }
}
</script>
</body>
</html>
