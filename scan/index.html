<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f4efe6">
<title>BORN ON · Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4efe6;
  --surface: #faf6ed;
  --surface-2: #ece4d2;
  --border: #d4c9b0;
  --border-bright: #b8ad94;
  --accent: #1f5f5b;
  --accent-2: #3a8a85;
  --accent-soft: rgba(31, 95, 91, 0.06);
  --accent-glow: rgba(31, 95, 91, 0.16);
  --text: #2c3530;
  --dim: #7a7568;
  --warn: #c47a3a;
  --bad: #a04545;
  --warn-soft: rgba(196, 122, 58, 0.06);
  --bad-soft: rgba(160, 69, 69, 0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--accent); color: var(--bg); }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  line-height: 1.55;
  font-size: 15px;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding: 28px 16px 100px;
  min-height: 100dvh;
}
.shell { max-width: 440px; width: 100%; margin: 0 auto; }

/* Brand bar */
.brand-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.7em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  padding-bottom: 14px;
  margin-bottom: 28px;
}
.brand-bar strong { color: var(--accent); font-weight: 700; letter-spacing: 0.32em; }

/* Hero — batch ID is the focal point */
.hero {
  text-align: center;
  padding: 36px 20px 28px;
  margin-bottom: 24px;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -64px; left: -64px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  pointer-events: none;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -64px; right: -64px;
  width: 240px; height: 240px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  pointer-events: none;
}
.hero .eyebrow {
  font-size: 0.68em;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  margin-bottom: 16px;
  position: relative;
}
.hero .batch {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: clamp(2.8rem, 14vw, 4.6rem);
  letter-spacing: -0.04em;
  color: var(--accent);
  text-shadow: 0 0 32px var(--accent-glow);
  line-height: 1;
  position: relative;
  word-break: break-all;
}
.hero .verified {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  font-size: 0.7em;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--accent-2);
  position: relative;
}
.hero .verified .dot {
  width: 8px; height: 8px;
  background: var(--accent-2);
  border-radius: 50%;
}

/* Outlet panel — clean two-column row */
.outlet-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 18px 20px;
  margin-bottom: 12px;
}
.outlet-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.outlet-row:last-child { border-bottom: 0; }
.outlet-row .k {
  font-size: 0.68em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
}
.outlet-row .v {
  font-weight: 500;
  color: var(--text);
  text-align: right;
}

/* Assessment heading */
.section-head {
  margin-bottom: 14px;
}
.section-head .h {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.section-head .sub {
  font-size: 0.78em;
  color: var(--dim);
  margin-top: 4px;
}

/* Assessment cards — 2x2 grid */
.assessment {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.opt {
  position: relative;
  cursor: pointer;
}
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .card {
  padding: 18px 14px;
  background: var(--surface);
  border: 2px solid transparent;
  text-align: center;
  transition: all 140ms cubic-bezier(0.4, 0, 0.2, 1);
  touch-action: manipulation;
}
.opt .icon {
  display: block;
  margin: 0 auto 8px;
  width: 32px;
  height: 32px;
}
.opt .lbl {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text);
  letter-spacing: 0.04em;
}
.opt .meta {
  font-size: 0.7em;
  color: var(--dim);
  margin-top: 4px;
  letter-spacing: 0.04em;
}
/* Selected states */
.opt input:checked + .card.fresh { border-color: var(--accent); background: var(--accent-soft); }
.opt input:checked + .card.fresh .lbl { color: var(--accent); }
.opt input:checked + .card.aging { border-color: var(--warn); background: var(--warn-soft); }
.opt input:checked + .card.aging .lbl { color: var(--warn); }
.opt input:checked + .card.stale { border-color: var(--bad); background: var(--bad-soft); }
.opt input:checked + .card.stale .lbl { color: var(--bad); }
.opt input:checked + .card.defect { border-color: var(--text); background: var(--surface-2); }
.opt input:checked + .card.defect .lbl { color: var(--text); }
.opt .card:hover { transform: translateY(-1px); }
.opt input:focus-visible + .card { outline: 2px solid var(--accent); outline-offset: 2px; }

/* CTA */
.btn-primary {
  width: 100%;
  margin-top: 8px;
  padding: 20px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 0.82em;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: var(--accent);
  color: var(--bg);
  border: none;
  cursor: pointer;
  transition: all 120ms cubic-bezier(0.4, 0, 0.2, 1);
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.btn-primary:hover { background: var(--text); }
.btn-primary:active { transform: translateY(1px); }
.btn-primary:disabled { background: var(--dim); cursor: not-allowed; }
.btn-primary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  box-shadow: 0 0 0 4px rgba(31,95,91,0.18);
}
.btn-primary .ico { width: 18px; height: 18px; }
@media (prefers-reduced-motion: reduce) {
  .btn-primary, .opt .card { transition: none; }
  .btn-primary:active { transform: none; }
}

/* Result */
.result-band {
  padding: 24px 16px;
  text-align: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-top: 14px;
  border: 2px solid;
}
.result-band small {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.45em;
  letter-spacing: 0.18em;
  margin-top: 8px;
  font-weight: 500;
  opacity: 0.7;
}
.result-band.fresh { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.result-band.good { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.result-band.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

/* Score block */
.score-block {
  margin-top: 12px;
  padding: 28px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  text-align: center;
}
.score-block .n {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 4.4rem;
  color: var(--accent);
  letter-spacing: -0.04em;
  line-height: 1;
  text-shadow: 0 0 32px var(--accent-glow);
}
.score-block .l {
  font-size: 0.72em;
  color: var(--dim);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-top: 14px;
  font-weight: 500;
}
.score-block .meta {
  margin-top: 16px;
  font-size: 0.82em;
  color: var(--dim);
}

.error {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid var(--bad);
  background: var(--bad-soft);
  color: var(--bad);
  font-size: 0.85em;
}

footer.brand-line {
  margin-top: 36px;
  text-align: center;
  font-size: 0.7em;
  letter-spacing: 0.22em;
  color: var(--dim);
  text-transform: uppercase;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="shell">

<div class="brand-bar">
  <span><strong>Fresh</strong> · Lab</span>
  <span>TZ · 2026</span>
</div>

<div class="hero">
  <div class="eyebrow">Active scan session</div>
  <div class="batch" id="born">—</div>
  <div class="verified"><span class="dot"></span>Verified batch</div>
</div>

<div class="outlet-panel">
  <div class="outlet-row">
    <span class="k">Outlet</span>
    <span class="v" id="outletMeta">—</span>
  </div>
  <div class="outlet-row">
    <span class="k">Scan time</span>
    <span class="v" id="scanTime">—</span>
  </div>
</div>

<div class="section-head">
  <div class="h">Sensory assessment</div>
  <div class="sub">Log the apparent bottle age.</div>
</div>

<form id="ageForm" onsubmit="event.preventDefault(); submitScan();">
<div class="assessment" role="radiogroup" aria-label="Bottle age">

  <label class="opt">
    <input type="radio" name="age" value="0" checked>
    <div class="card fresh">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--accent)"><path d="M12 2.5c-3 4-7 8-7 12a7 7 0 0014 0c0-4-4-8-7-12z" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 14a3 3 0 003 3" stroke-linecap="round"/></svg>
      <div class="lbl">Fresh</div>
      <div class="meta">&lt; 30 days</div>
    </div>
  </label>

  <label class="opt">
    <input type="radio" name="age" value="14">
    <div class="card aging">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--warn)"><path d="M6 3h12M6 21h12M7 3v18M17 3v18M9 8h6M9 12h6M9 16h6" stroke-linecap="round"/></svg>
      <div class="lbl">Aging</div>
      <div class="meta">30–90 days</div>
    </div>
  </label>

  <label class="opt">
    <input type="radio" name="age" value="60">
    <div class="card stale">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--bad)"><path d="M12 3l10 18H2L12 3z" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 10v4M12 17v.5" stroke-linecap="round"/></svg>
      <div class="lbl">Stale</div>
      <div class="meta">&gt; 90 days</div>
    </div>
  </label>

  <label class="opt">
    <input type="radio" name="age" value="30">
    <div class="card defect">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text)"><path d="M9 3h6l-1 5 4 5-4 5 1 5H9l1-5-4-5 4-5-1-5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="lbl">Defect</div>
      <div class="meta">Off-flavor</div>
    </div>
  </label>

</div>

<button class="btn-primary" type="submit">
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M6 10l6-6 6 6M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Report freshness
</button>
</form>

<div id="error" style="display:none" class="error" role="alert" aria-live="assertive"></div>
<div id="result" style="display:none" class="result-band" aria-live="polite"></div>

<div id="scorePanel" style="display:none">
  <div class="score-block">
    <div class="n" id="scoreNum">—</div>
    <div class="l" id="scoreBand">—</div>
    <div class="meta" id="scoreMeta">—</div>
  </div>
</div>

<footer class="brand-line">Fresh Beer Lab · Tanzania · 2026</footer>

</div>

<script>
const API = 'https://api.fauluhost.co.tz';
const params = new URLSearchParams(location.search);
const batchId = params.get('batch') || '';
const outletId = params.get('outlet') || '';
document.getElementById('born').textContent = batchId || '—';
document.getElementById('outletMeta').textContent = outletId || '—';
document.getElementById('scanTime').textContent =
  new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Africa/Dar_es_Salaam' }).format(new Date()) + ' EAT';

const dtf = new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Dar_es_Salaam' });

async function submitScan(){
  const errEl = document.getElementById('error');
  const resultEl = document.getElementById('result');
  const scorePanel = document.getElementById('scorePanel');
  const btn = document.querySelector('.btn-primary');
  errEl.style.display = 'none';
  resultEl.style.display = 'none';
  scorePanel.style.display = 'none';

  if (!batchId || !outletId){
    errEl.textContent = 'Missing batch or outlet in QR. Contact your retailer.';
    errEl.style.display = 'block';
    return;
  }

  const age = parseInt(document.querySelector('input[name="age"]:checked').value);
  btn.disabled = true;
  btn.querySelector('.btn-primary span:last-child') || (btn.textContent = 'Reporting…');

  try {
    const r = await fetch(API + '/scan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        batch_id: batchId,
        outlet_id: outletId,
        born_on: dtf.format(new Date(Date.now() - age * 86400000))
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    resultEl.style.display = 'block';
    const cls = d.band === 'FRESH' ? 'fresh' : d.band === 'GOOD' ? 'good' : 'bad';
    resultEl.className = 'result-band ' + cls;
    resultEl.innerHTML = d.band + '<small>' + d.age_days + ' days old</small>';

    scorePanel.style.display = 'block';
    document.getElementById('scoreNum').textContent = d.outlet_score.score;
    document.getElementById('scoreBand').textContent = d.outlet_score.band;
    document.getElementById('scoreMeta').textContent =
      d.outlet_score.scans + ' scans · ' +
      d.outlet_score.fresh_pct + '% fresh · avg age ' +
      d.outlet_score.avg_age_days + ' days';
  } catch (e){
    errEl.textContent = 'Could not reach server: ' + e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    const lbl = btn.querySelector('span');
    if (lbl) lbl.textContent = 'Report freshness';
  }
}
</script>
</body>
</html>
